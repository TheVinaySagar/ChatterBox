<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/style.css">
  <title>ChatterBox - Live Chat</title>
</head>
<body>
  <div class="chat-container fade-in">
    <header class="chat-header">
      <h1><i class="fas fa-comments"></i> ChatterBox</h1>
      <div class="controls">
        <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode">
          <i class="fas fa-moon"></i>
        </button>
        <a href="index.html" class="btn btn-secondary">
          <i class="fas fa-sign-out-alt"></i> Leave Room
        </a>
      </div>
    </header>
    
    <main class="chat-main">
      <div class="chat-sidebar">
        <div class="room-info">
          <h2 id="room-name">Loading...</h2>
          <p><i class="fas fa-users"></i> <span id="user-count">0</span> users online</p>
        </div>
        
        <div class="users-section">
          <h3><i class="fas fa-users"></i> Active Users</h3>
          <div class="users-list" id="users">
            <!-- Users will be populated here -->
          </div>
        </div>
      </div>
      
      <div class="chat-messages" id="chat-messages">
        <!-- Messages will appear here -->
      </div>
    </main>
    
    <div class="chat-form-container">
      <div class="chat-features">
        <div class="feature-indicator">
          <div class="online-indicator"></div>
          <span>Online</span>
        </div>
        <div class="feature-indicator" id="typing-status">
          <i class="fas fa-keyboard"></i>
          <span>Ready to type</span>
        </div>
      </div>
      
      <form class="chat-form" id="chat-form">
        <div class="message-input-container">
          <textarea
            id="msg"
            class="message-input"
            placeholder="Type your message..."
            required
            autocomplete="off"
            rows="1"
          ></textarea>
          <button type="button" class="emoji-button" id="emoji-button">😊</button>
          <div class="emoji-picker" id="emoji-picker">
            <!-- Emojis will be populated here -->
          </div>
        </div>
        <button type="submit" class="send-button" id="send-button">
          <i class="fas fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qs/6.9.2/qs.min.js" integrity="sha512-f0AM6x08kthGzMyDHZjBgjBCPp8V8ovlHYCI1jMkhViTeX3MykGCf/DnN1khWss/6d1105eAG4TniSKy6UhZrw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="socket.io/socket.io.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
